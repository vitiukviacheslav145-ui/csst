<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин товарів</title>
</head>

<body>
    <h1>Наші товари</h1>
    <div class="products">
        <div class="product-card">
            <div class="product-img"> <img src="https://picsum.photos/600/300?random=1" alt="Ноутбук">

            </div>
            <div class="product-info">
                <h3 class="product-name">Ноутбук</h3>
                <p class="product-price">25 000 грн</p>
            </div>
        </div>
        <div class="product-card">
            <div class="product-img"> <img src="https://picsum.photos/400/300?random=2" alt="Навушники">

                <h3 class="product-name">Навушники</h3>

        </div>
        <div class="product-card">
            <div class="product-img"> <img src="https://picsum.photos/400/300?random=3" alt="Смартгодинник">

            </div>

                <h3 class="product-name">Смартгодинник</h3>
                <p class="product-price">2 500 грн</p>
            </div>
        </div>
        <div class="product-card">
            <div class="product-img"> <img src="https://picsum.photos/400/300?random=4" alt="Фотоапарат">
                <div class="product-actions"> <button class="action-btn">🛒 В кошик</button> </div>
            </div>
            <div class="product-info">
                <h3 class="product-name">Фотоапарат</h3>
                <p class="product-price">12 000 грн</p>
            </div>
        </div>
    </div>
</body>

</html>
